<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#1a0a00;font-family:'Noto Sans JP',sans-serif;color:#fff;overscroll-behavior:none}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.5}
select option{background:#1a0a00}
button{font-family:inherit}
@keyframes fp{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
#hd{background:linear-gradient(135deg,#c0392b,#e74c3c 40%,#f39c12);position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(231,76,60,.6)}
#hi{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
#lg{display:flex;align-items:center;gap:8px}
#fl{font-size:28px}
#lt{font-size:20px;font-weight:900;letter-spacing:-.5px;text-shadow:0 2px 8px rgba(0,0,0,.4);line-height:1.1}
#ls{font-size:10px;opacity:.85;letter-spacing:1px}
#pw{height:6px;background:rgba(0,0,0,.3)}
#pf{height:100%;background:#fff;transition:width .5s;border-radius:0 3px 3px 0;width:0}
#hr2{text-align:right}
#pp{font-size:22px;font-weight:900}
#pc{font-size:10px;opacity:.8}
#nv{display:flex;background:#2d0e00;border-bottom:2px solid #c0392b}
.nb{flex:1;padding:12px 8px;background:transparent;border:none;color:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer}
.nb.on{background:#c0392b;color:#fff}
#tt{display:flex;gap:8px;padding:12px 16px;background:#2d0e00;border-bottom:1px solid rgba(192,57,43,.3);overflow-x:auto}
.tb{padding:8px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.6);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tb.on{background:#f39c12;border-color:#f39c12;color:#1a0a00}
.ct{padding:16px;max-width:600px;margin:0 auto}
#es{display:flex;align-items:center;gap:8px;margin-bottom:16px;background:#2d0e00;border-radius:12px;padding:12px;border:1px solid rgba(192,57,43,.27)}

var EVS=[],AID=null,SORT=false,ECID=null,EIID=null,ACID=null,CTAG=0;

function gid(){return "x"+Math.random().toString(36).substr(2,9);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function load(){
  var s=null;
  var keys=["gc4","gc3","gotchi-v2","gotchi-events"];
  for(var k=0;k<keys.length;k++){
    try{var t=localStorage.getItem(keys[k]);if(t){s=t;break;}}catch(e){}
  }
  if(s){
    try{var p=JSON.parse(s);if(p&&p.length>0){EVS=p;AID=EVS[0].id;return;}}catch(e){}
  }
  EVS=JSON.parse(JSON.stringify(DEF));
  AID=EVS[0].id;
  save();
}
function save(){try{localStorage.setItem("gc4",JSON.stringify(EVS));}catch(e){}}
function hardReset(){
  var keys=["gc4","gc3","gotchi-v2","gotchi-events"];
  for(var k=0;k<keys.length;k++){try{localStorage.removeItem(keys[k]);}catch(e){}}
  EVS=JSON.parse(JSON.stringify(DEF));
  AID=EVS[0].id;CTAG=0;save();render();
}

function getEv(){for(var i=0;i<EVS.length;i++){if(EVS[i].id===AID)return EVS[i];}return null;}
function tagEvs(){var r=[];for(var i=0;i<EVS.length;i++){var t=EVS[i].tag;if(t===undefined)t=0;if(t===CTAG)r.push(EVS[i]);}return r;}

function render(){rHead();rSel();rCats();rEvList();rCopySel();}

function rHead(){
  var ev=getEv();var tot=0,chk=0;
  if(ev){for(var i=0;i<ev.categories.length;i++){var c=ev.categories[i];for(var j=0;j<c.items.length;j++){tot++;if(c.items[j].checked)chk++;}}}
  var pct=tot===0?0:Math.round(chk/tot*100);
  document.getElementById("pp").textContent=pct+"%";
  document.getElementById("pc").textContent=chk+"/"+tot;
  document.getElementById("pf").style.width=pct+"%";
  document.getElementById("s0").textContent=tot;
  document.getElementById("s1").textContent=chk;
  document.getElementById("s2").textContent=tot-chk;
}

function rSel(){
  var sel=document.getElementById("ev");
  var evs=tagEvs();
  var found=false;
  for(var i=0;i<evs.length;i++){if(evs[i].id===AID){found=true;break;}}
  if(!found&&evs.length>0){AID=evs[0].id;}
  var h="";
  for(var i=0;i<evs.length;i++){var e=evs[i];h+="<option value=\""+esc(e.id)+"\""+( e.id===AID?" selected":"")+">"+esc(e.name)+(e.date?"  "+e.date:"")+"</option>";}

  sel.innerHTML=h;
  var ev=getEv();
  document.getElementById("sb").style.display=(ev&&ev.categories.length>1)?"flex":"none";
}

  var h="";
  for(var ci=0;ci<ev.categories.length;ci++){
    var cat=ev.categories[ci];
    var unc=[],chkArr=[];
    for(var ii=0;ii<cat.items.length;ii++){if(cat.items[ii].checked)chkArr.push(ii);else unc.push(ii);}
    var order=unc.concat(chkArr);
    var chkCnt=chkArr.length;
    var iF=ci===0,iL=ci===ev.categories.length-1;
    var sa="";
    if(SORT){
      sa+="<button class=\"sa\""+( iF?" disabled":"")+" onclick=\"moveCat('"+cat.id+"',-1)\">▲</button>";
      sa+="<button class=\"sa\""+( iL?" disabled":"")+" onclick=\"moveCat('"+cat.id+"',1)\">▼</button>";
    }
    var sub=SORT?(cat.items.length+" アイテム"):(chkCnt+"/"+cat.items.length+" 完了");
    var rows="";
    if(!SORT){
      for(var oi=0;oi<order.length;oi++){
        var ii=order[oi];var it=cat.items[ii];
        var isBtns="";
        if(!it.checked){
          var pU=(oi>0&&!cat.items[order[oi-1]].checked);
          var nU=(oi<order.length-1&&!cat.items[order[oi+1]].checked);
          isBtns+="<button class=\"isa\""+( pU?"":" disabled")+" onclick=\"moveItem('"+cat.id+"','"+it.id+"',-1)\">▲</button>";
          isBtns+="<button class=\"isa\""+( nU?"":" disabled")+" onclick=\"moveItem('"+cat.id+"','"+it.id+"',1)\">▼</button>";
        }
        rows+="<div class=\"ir"+( it.checked?" ck":"")+"\" id=\"r"+it.id+"\">";
        rows+="<div class=\"bx"+( it.checked?" ck":"")+"\";onclick=\"togItem('"+cat.id+"','"+it.id+"')\">"+( it.checked?"✓":"")+"</div>";
        rows+="<div class=\"nm"+( it.checked?" ck":"")+"\";onclick=\"openMo('"+cat.id+"','"+it.id+"')\">"+esc(it.name)+"</div>";
        rows+=isBtns;
        rows+="<input class=\"qe\" id=\"q"+it.id+"\" value=\""+esc(it.qty)+"\" onchange=\"setQty('"+cat.id+"','"+it.id+"',this.value)\" onclick=\"this.select()\">";
        rows+="<button class=\"db\" onclick=\"delItem('"+cat.id+"','"+it.id+"')\">×</button></div>";
      }
      if(ACID===cat.id){
        rows+="<div class=\"ar\"><input class=\"ti\" style=\"flex:1;min-width:80px\" id=\"ni"+cat.id+"\" placeholder=\"アイテム名\"><input class=\"ti\" style=\"width:80px;flex-shrink:0\" id=\"nq"+cat.id+"\" placeholder=\"数量\"><button class=\"ok\" onclick=\"doAddItem('"+cat.id+"')\">追加</button><button class=\"ng\" onclick=\"cancelAI()\">✕</button></div>";
      }else{
        rows+="<button class=\"aib\" onclick=\"startAI('"+cat.id+"')\">＋ アイテムを追加</button>";
      }
    }else{
      rows="<div style=\"padding:8px 14px;font-size:12px;opacity:.5\">"+cat.items.length+" アイテム</div>";
    }
    h+="<div class=\"cb"+( SORT?" sm":"")+"\" id=\"ct"+cat.id+"\">";
    h+="<div class=\"ch\"><div><div class=\"cn\">"+esc(cat.name)+"</div><div class=\"cs\">"+sub+"</div></div>";
    h+="<div class=\"ca\">"+sa+"<button class=\"ib\" onclick=\"delCat('"+cat.id+"')\">🗑</button></div></div>";
    h+=rows+"</div>";
  }
  cc.innerHTML=h;
  if(ACID){var el=document.getElementById("ni"+ACID);if(el)el.focus();}
}

function rEvList(){
  var el=document.getElementById("el");var h="";
  for(var i=0;i<EVS.length;i++){
    var e=EVS[i];var tot=0,chk=0;
    for(var ci=0;ci<e.categories.length;ci++){var c=e.categories[ci];for(var ii=0;ii<c.items.length;ii++){tot++;if(c.items[ii].checked)chk++;}}
    var act=e.id===AID;
    var tl=e.tag===1?"🏪 百貨店催事":"🏕 屋外イベント";
    h+="<div class=\"ec"+( act?" on":"")+"\">";
    h+="<div style=\"flex:1\"><div style=\"font-size:10px;color:#f39c12;margin-bottom:2px\">"+tl+"</div><div style=\"font-weight:800;font-size:15px\">"+esc(e.name)+"</div>";
    if(e.date)h+="<div style=\"font-size:11px;opacity:.6;margin-top:2px\">"+esc(e.date)+"</div>";
    h+="<div style=\"font-size:11px;color:#f39c12;margin-top:4px\">"+chk+"/"+tot+" チェック済み</div></div>";
    h+="<button class=\"esb"+( act?" on":"")+"\";onclick=\"selEv('"+e.id+"')\">"+( act?"✓ 選択中":"選択")+"</button>";
    if(EVS.length>1)h+="<button class=\"ib\" onclick=\"delEv('"+e.id+"')\">🗑</button>";
    h+="</div>";
  }
  el.innerHTML=h;
}

function rCopySel(){
  var sel=document.getElementById("cfs");var cur=sel.value;
  var h="<option value=\"\">&#12540; 空のリストで始める &#12540;</option>";
  for(var i=0;i<EVS.length;i++){var e=EVS[i];h+="<option value=\""+esc(e.id)+"\""+( e.id===cur?" selected":"")+">"+esc(e.name)+"</option>";}
  sel.innerHTML=h;
}

function sw(v){
  document.getElementById("vc").style.display=v==="c"?"block":"none";
  document.getElementById("ve").style.display=v==="e"?"block":"none";
  document.getElementById("tt").style.display=v==="c"?"flex":"none";
  document.getElementById("n0").className="nb"+( v==="c"?" on":"");
  document.getElementById("n1").className="nb"+( v==="e"?" on":"");
  if(v==="c"){SORT=false;updSMB();}
  if(v==="e"){rCopySel();}
}
function selTag(t){
  CTAG=t;
  document.getElementById("tb0").className="tb"+( t===0?" on":"");
  document.getElementById("tb1").className="tb"+( t===1?" on":"");
  render();
}
function onSel(id){AID=id;render();}
function selEv(id){AID=id;sw("c");render();}

function togItem(cid,iid){
  var ev=getEv();
  for(var ci=0;ci<ev.categories.length;ci++){
    if(ev.categories[ci].id!==cid)continue;
    var cat=ev.categories[ci];
    for(var ii=0;ii<cat.items.length;ii++){
      if(cat.items[ii].id!==iid)continue;
      cat.items[ii].checked=!cat.items[ii].checked;
      save();
      var fl=document.getElementById("fl");
      fl.style.animation="fp 0.6s ease";
      setTimeout(function(){document.getElementById("fl").style.animation="";},600);
      rCats();rHead();return;
    }
  }
}
function setQty(cid,iid,val){
  var ev=getEv();
  for(var ci=0;ci<ev.categories.length;ci++){
    if(ev.categories[ci].id!==cid)continue;
    for(var ii=0;ii<ev.categories[ci].items.length;ii++){
      if(ev.categories[ci].items[ii].id!==iid)continue;
      ev.categories[ci].items[ii].qty=String(val);save();return;
    }
  }
}
function delItem(cid,iid){
  var ev=getEv();
  for(var ci=0;ci<ev.categories.length;ci++){
    if(ev.categories[ci].id!==cid)continue;
    var items=[];
    for(var ii=0;ii<ev.categories[ci].items.length;ii++){if(ev.categories[ci].items[ii].id!==iid)items.push(ev.categories[ci].items[ii]);}
    ev.categories[ci].items=items;save();rCats();rHead();return;
  }
}
function moveItem(cid,iid,d){
  var ev=getEv();
  for(var ci=0;ci<ev.categories.length;ci++){
    if(ev.categories[ci].id!==cid)continue;
    var cat=ev.categories[ci];
    var idx=-1;for(var ii=0;ii<cat.items.length;ii++){if(cat.items[ii].id===iid){idx=ii;break;}}
    var unc=[];for(var ii=0;ii<cat.items.length;ii++){if(!cat.items[ii].checked)unc.push(ii);}
    var pos=-1;for(var k=0;k<unc.length;k++){if(unc[k]===idx){pos=k;break;}}
    var np=pos+d;if(np<0||np>=unc.length)return;
    var tmp=cat.items[unc[pos]];cat.items[unc[pos]]=cat.items[unc[np]];cat.items[unc[np]]=tmp;
    save();rCats();return;
  }
}
function startAI(cid){ACID=cid;rCats();}
function cancelAI(){ACID=null;rCats();}
function doAddItem(cid){
  var ne=document.getElementById("ni"+cid);var qe=document.getElementById("nq"+cid);
  if(!ne)return;
  var name=ne.value.replace(/^\s+|\s+$/g,"");if(!name)return;
  var qty=qe?qe.value.replace(/^\s+|\s+$/g,""):"1";if(!qty)qty="1";
  var ev=getEv();
  for(var ci=0;ci<ev.categories.length;ci++){
    if(ev.categories[ci].id!==cid)continue;
    ev.categories[ci].items.push({id:gid(),name:name,qty:qty,checked:false});
    save();ACID=null;rCats();rHead();return;
  }
}
function showAC(){document.getElementById("acf").style.display="block";document.getElementById("acb").style.display="none";document.getElementById("ncn").focus();}
function hideAC(){document.getElementById("acf").style.display="none";document.getElementById("acb").style.display="block";}
function doAddCat(){
  var name=document.getElementById("ncn").value.replace(/^\s+|\s+$/g,"");if(!name)return;
  var ev=getEv();if(!ev)return;
  ev.categories.push({id:gid(),name:name,items:[]});
  save();document.getElementById("ncn").value="";hideAC();rCats();rSel();
}
function delCat(cid){
  var ev=getEv();if(!ev)return;
  var cats=[];for(var i=0;i<ev.categories.length;i++){if(ev.categories[i].id!==cid)cats.push(ev.categories[i]);}
  ev.categories=cats;save();rCats();rSel();rHead();
}
function moveCat(cid,d){
  var ev=getEv();if(!ev)return;
  var idx=-1;for(var i=0;i<ev.categories.length;i++){if(ev.categories[i].id===cid){idx=i;break;}}
  var ni=idx+d;if(ni<0||ni>=ev.categories.length)return;
  var tmp=ev.categories[idx];ev.categories[idx]=ev.categories[ni];ev.categories[ni]=tmp;
  save();rCats();
}
function togSort(){SORT=!SORT;updSMB();rCats();}
function updSMB(){
  var b=document.getElementById("smb");
  if(SORT){b.textContent="✓ 並び替え完了";b.className="smb on";}
  else{b.textContent="⇅ 並び替えモード";b.className="smb";}
}
function doReset(){
  var ev=getEv();if(!ev)return;
  for(var ci=0;ci<ev.categories.length;ci++)for(var ii=0;ii<ev.categories[ci].items.length;ii++)ev.categories[ci].items[ii].checked=false;
  save();rCats();rHead();
}
function doAddEv(){
  var name=document.getElementById("nen").value.replace(/^\s+|\s+$/g,"");if(!name)return;
  var date=document.getElementById("ned").value;
  var tag=parseInt(document.getElementById("ntag").value)||0;
  var copyId=document.getElementById("cfs").value;
  var cats=[];
  if(copyId){
    for(var i=0;i<EVS.length;i++){
      if(EVS[i].id!==copyId)continue;
      var src=EVS[i];
      for(var ci=0;ci<src.categories.length;ci++){
        var sc=src.categories[ci];var items=[];
        for(var ii=0;ii<sc.items.length;ii++){var si=sc.items[ii];items.push({id:gid(),name:si.name,qty:si.qty,checked:false});}
        cats.push({id:gid(),name:sc.name,items:items});
      }
      break;
    }
  }
  var ne={id:gid(),tag:tag,name:name,date:date,categories:cats};
  EVS.push(ne);AID=ne.id;CTAG=tag;save();
  document.getElementById("nen").value="";document.getElementById("ned").value="";
  document.getElementById("cfs").value="";document.getElementById("ch").style.display="none";
  document.getElementById("aeb").textContent="イベントを追加";
  selTag(tag);sw("c");render();
}
function delEv(id){
  var evs=[];for(var i=0;i<EVS.length;i++){if(EVS[i].id!==id)evs.push(EVS[i]);}
  EVS=evs;if(AID===id)AID=EVS.length>0?EVS[0].id:null;save();render();
}
function onCFC(){
  var v=document.getElementById("cfs").value;
  document.getElementById("ch").style.display=v?"block":"none";
  document.getElementById("aeb").textContent=v?"📋 流用してイベントを追加":"イベントを追加";
}
function openMo(cid,iid){
  var ev=getEv();
  for(var ci=0;ci<ev.categories.length;ci++){
    if(ev.categories[ci].id!==cid)continue;
    for(var ii=0;ii<ev.categories[ci].items.length;ii++){
      if(ev.categories[ci].items[ii].id!==iid)continue;
      var it=ev.categories[ci].items[ii];ECID=cid;EIID=iid;
      document.getElementById("ein").value=it.name;
      document.getElementById("eiq").value=it.qty;
      document.getElementById("mo").className="show";
      setTimeout(function(){document.getElementById("ein").focus();},100);return;
    }
  }
}
function closeMo(){document.getElementById("mo").className="";ECID=null;EIID=null;}
function saveMo(){
  if(!ECID||!EIID)return;var ev=getEv();
  for(var ci=0;ci<ev.categories.length;ci++){
    if(ev.categories[ci].id!==ECID)continue;
    for(var ii=0;ii<ev.categories[ci].items.length;ii++){
      if(ev.categories[ci].items[ii].id!==EIID)continue;
      var n=document.getElementById("ein").value.replace(/^\s+|\s+$/g,"");
      var q=document.getElementById("eiq").value.replace(/^\s+|\s+$/g,"");
      if(n)ev.categories[ci].items[ii].name=n;
      ev.categories[ci].items[ii].qty=q||"1";
      save();closeMo();rCats();return;
    }
  }
}
load();
render();

</script>
</body>
</html>
